services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    env_file:
      - .env.production
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      VALIDATION_SERVICE_URL: http://validation:8081
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      validation:
        condition: service_started
    restart: unless-stopped

  validation:
    build:
      context: .
      dockerfile: services/validation/Dockerfile
    env_file:
      - .env.production
    environment:
      VALIDATION_PORT: "8081"
    ports:
      - "8081:8081"
    restart: unless-stopped

  transformation:
    build:
      context: .
      dockerfile: services/transformation/Dockerfile
    env_file:
      - .env.production
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      TRANSFORMATION_PORT: "8082"
      TRANSFORMED_OUTPUT_DIR: /app/output
    ports:
      - "8082:8082"
    volumes:
      - transformation_output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  transformation_output: