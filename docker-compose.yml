
# Settings shared by every application container.
x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: "5432"
  LOG_FORMAT: json
  METRICS_PORT: "9090"

# Workers serve /health and /metrics on METRICS_PORT.
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/health || exit 1"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  volume-init:
    image: alpine:3.22
    user: root
    command: ["chown", "-R", "1001:1001", "/app/uploads", "/app/output"]
    volumes:
      - uploads_data:/app/uploads
      - transformation_output:/app/output
    restart: "no"


  migrate:
    build:
      context: .
      dockerfile: packages/cmd/migrate/Dockerfile
    env_file:
      - .env.production
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    # Metrics (9090) stay inside the Docker network.
    expose:
      - "9090"
    env_file:
      - .env.production
    environment:
      <<: *app-env
      API_PORT: "8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  validation:
    build:
      context: .
      dockerfile: services/validation/Dockerfile
    env_file:
      - .env.production
    environment:
      LOG_FORMAT: json
      VALIDATION_PORT: "8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    env_file:
      - .env.production
    environment:
      <<: *app-env
      VALIDATION_SERVICE_URL: http://validation:8081
      UPLOADS_DIR: /app/uploads
    expose:
      - "9090"
    volumes:
      - uploads_data:/app/uploads
    healthcheck: *worker-healthcheck
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      validation:
        condition: service_healthy
    restart: unless-stopped

  transformation:
    build:
      context: .
      dockerfile: services/transformation/Dockerfile
    env_file:
      - .env.production
    environment:
      <<: *app-env
      TRANSFORMED_OUTPUT_DIR: /app/output
    expose:
      - "9090"
    volumes:
      - transformation_output:/app/output
    healthcheck: *worker-healthcheck
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  aggregation:
    build:
      context: .
      dockerfile: services/aggregation/Dockerfile
    env_file:
      - .env.production
    environment:
      <<: *app-env
      AGGREGATED_OUTPUT_DIR: /app/output
    expose:
      - "9090"
    volumes:
      - transformation_output:/app/output
    healthcheck: *worker-healthcheck
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  export:
    build:
      context: .
      dockerfile: services/export/Dockerfile
    env_file:
      - .env.production
    environment:
      <<: *app-env
      EXPORTED_OUTPUT_DIR: /app/output
    expose:
      - "9090"
    volumes:
      - transformation_output:/app/output
    healthcheck: *worker-healthcheck
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  transformation_output:
